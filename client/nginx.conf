server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version (ZAP 10036)
    server_tokens off;

    # ── Security headers ────────────────────────────────────────────────────
    # Set here, in the image, so they apply wherever this container runs —
    # not only behind the production host nginx.
    #
    # NOTE on nginx inheritance: an `add_header` in ANY nested location block
    # discards every add_header inherited from this level. The location blocks
    # below therefore use `expires` (which does not reset inheritance) rather
    # than add_header for cache policy.

    add_header X-Content-Type-Options "nosniff" always;              # ZAP 10021
    add_header X-Frame-Options "DENY" always;                        # ZAP 10020
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;      # ZAP 90004
    add_header Cross-Origin-Resource-Policy "same-origin" always;    # ZAP 90004
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;  # ZAP 10063

    # Content-Security-Policy (ZAP 10038). Derived from what the app actually
    # loads:
    #   script-src 'self'   — the CRA runtime chunk is emitted as a file
    #                         (INLINE_RUNTIME_CHUNK=false), so no inline JS.
    #                         This also neutralises scripts inside the
    #                         customer email HTML we render.
    #   style-src  'unsafe-inline' — React style={{...}} attributes and the
    #                         <style> block the inbox injects at runtime.
    #   img/media  https:   — profile pictures, ad creatives and message
    #                         attachments come from many Meta CDN hosts.
    #   connect-src ws/wss  — Socket.IO live updates.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' ws: wss:; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Hashed build assets are immutable — cache hard.
    location /static/ {
        expires 1y;
    }

    # The SPA shell must revalidate so a deploy is picked up immediately
    # (ZAP 10049) — `expires` keeps the security headers above inherited.
    location = /index.html {
        expires -1;
    }

    # React Router — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
