# =============================================================================
# Unified Inbox — Production Docker Compose (Hostinger VPS)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires: .env.production in the same directory (never committed to Git)
# =============================================================================

networks:
  unified-inbox:
    driver: bridge

volumes:
  uptime-kuma:
  # Outbound message media (server/uploads) — must survive container
  # recreation on deploy, or attachment URLs in old messages break.
  uploads-data:
  # UnifiedBox1 + UnifiedBoxDW data and log files. Back this volume up.
  sqlserver-data:

services:
  # ── SQL Server 2025 Express — UnifiedBox1 (app) + UnifiedBoxDW (warehouse) ─
  # Databases are created once by database/sqlserver/deploy.sh (see
  # database/sqlserver/README.md). SQL Server needs 2 GB of RAM to start.
  # sqlserver.env holds MSSQL_SA_PASSWORD only — never the backend's file,
  # so the sa password stays out of the backend container.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver
    env_file:
      - sqlserver.env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - TZ=UTC
    ports:
      - "127.0.0.1:1433:1433"   # Only localhost — reach it through an SSH tunnel
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - unified-inbox
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Backend — Express API + Socket.IO ──────────────────────────────────────
  backend:
    image: ademxd/projetpfe-backend:latest
    container_name: backend
    env_file:
      - .env.production
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:5000:5000"   # Only localhost — host Nginx proxies external traffic
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - uploads-data:/app/server/uploads
    networks:
      unified-inbox:
        aliases:
          - backend-service
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend — React SPA served by Nginx ───────────────────────────────────
  frontend:
    image: ademxd/projetpfe-frontend:latest
    container_name: frontend
    ports:
      - "127.0.0.1:3000:80"   # Only localhost — host Nginx proxies external traffic
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - unified-inbox
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ── Uptime Kuma — Lightweight monitoring + alerts ──────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "127.0.0.1:3001:3001"   # Access via SSH tunnel or add Nginx proxy
    volumes:
      - uptime-kuma:/app/data
    networks:
      - unified-inbox
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: "0.15"
